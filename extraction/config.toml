# ============================================================
# extraction/config.toml
# ------------------------------------------------------------
# Offpage 自动化提取流水线配置
#
# 加载入口：extraction.persona_extraction.core.config.load_config()
# 覆盖优先级（高 → 低）：
#   CLI flag  >  config.local.toml  >  本文件  >  代码 dataclass 默认值
#
# 本地覆盖：可在同目录创建 `config.local.toml`（.gitignore），
#   同名键二次覆盖，文件不存在时忽略。
# ============================================================


# ----------------------------------------------------------------
# [stage] 阶段规划
# ----------------------------------------------------------------
[stage]
# Phase 1 stage_plan 出口验证使用的章节数边界。LLM 产出违反此区间的
# stage 时，删除 stage_plan.json 并重跑 LLM（最多 phase1.exit_validation_max_retry
# 次），仍违规则 abort。
target_chapter_count = 10        # 典型目标章节数
min_chapter_count    = 8         # 单 stage 最少章节数
max_chapter_count    = 15        # 单 stage 最多章节数


# ----------------------------------------------------------------
# [phase0] Phase 0 章节归纳
# ----------------------------------------------------------------
[phase0]
# 章节归纳 chunk 的并行度（ThreadPoolExecutor 线程数）。订阅模式下并发
# 越高越容易撞 5h 限额；调小可降低限额风险。CLI `--concurrency` 同时
# 影响 phase0 与 phase4，本键提供默认值。**12** 是覆盖 phase 3 决策 #55
# 4-sub-lane 拓扑下 2 角色峰值 `1 + 2×4 + 2 = 11` 的最小值；3 sub-lane
# 时代曾为 10。
concurrency              = 12

# Phase 0 单 chunk summarize 子进程超时（秒）。每 chunk 读 20 章 + 写
# 20× per-summary（150–200 字）+ 5 个 chunk-level 二级聚合字段
# （chunk_arc_summary / chunk_world_rules / chunk_power_levels /
# chunk_factions / chunk_regions），opus-4-7 effort=max 单 chunk wall
# 经验值常 ≥ 600s，给到 1800s 留余量（按 20 章基数）。
summarize_timeout_s      = 1800

# Phase 0 内 L2 JSON 修复的 LLM 调用超时（秒）。L2 是"喂坏 JSON 给
# LLM 修一次"，比正常归纳短得多。
json_repair_l2_timeout_s = 600

# Phase 0 recovery sweep 用的 effort 等级（low/medium/high/max）。主
# 循环结束后，失败 chunk（error 含 'timed out' / 'error_max_turns'
# 且 recovery_attempted=False）会用此 effort 单次 sweep 救火。背景：
# opus-4-7 effort=max 在多字段 chunk synthesis 偶发服务器端长思考
# 超 1800s wall（runtime 实测 effort=high 14 min 完工 schema 同样
# valid，质量等价），故"主流程默认 max 保留质量 + sweep 用 high
# 救撞墙"。详见 ai_context/decisions.md #49。
recovery_effort          = "high"


# ----------------------------------------------------------------
# [phase1] Phase 1 全书分析（lane fan-out）
# ----------------------------------------------------------------
[phase1]
# Per-lane 出口验证最大重试次数（决策 #52，每 lane 独立预算，不共享池）。
# Phase 1 fan-out 成 lane（monolithic = foundation / stage_plan /
# candidate_characters 三 lane；light_novel = foundation +
# candidate_characters 两 lane，stage_plan 由程序化派生不调 LLM）。
# Schema 校验失败 / stage 章数违规 → prior_error 注入下一次重试 prompt
# （与 phase 0 / phase 4 同形态），用尽走 #48 length-tolerance gate 兜底。
exit_validation_max_retry = 2

# Phase 1 lane fan-out 并发度（ThreadPoolExecutor max_workers）。默认 = 3
# 即最大 lane 数（monolithic 3 lane 并发；light_novel 2 lane 因 stage_plan
# 程序化派生）。订阅模式高并发易撞 5h 限额，可调低。
lane_concurrency          = 3


# ----------------------------------------------------------------
# [phase2] Phase 2 baseline production（lane fan-out，决策 #59）
# ----------------------------------------------------------------
[phase2]
# Lane fan-out 并发度（ThreadPoolExecutor max_workers）。lane A
# (key_figures) 先行串行跑完（对 foundation.json 就地改写，须与其他
# lane 错开）；其余 1+2N 个 lane（fixed_relationships + 每目标角色
# identity + target_baseline 两 lane）共享此并发池。默认 5 = N=2
# 目标角色时的 lane 总数。订阅模式高并发易撞 5h 限额，可调低。
lane_concurrency          = 5

# 输出文件缺失时的 LLM 重跑上限。LLM call 结束后声明的输出文件不
# 存在（生成失败，file-based repair 无从修起）→ prior_error 注入
# 重跑，最多这么多次。单 lane 总尝试数 = 1 + 此值。
output_missing_max_retry  = 1

# Per-lane file-level repair 开关（决策 #59 缩水版接入）。
# true：每 lane 产物过 repair lifecycle——T0 程序修 / T1 局部 patch +
#       schema checker + phase2 引用 checker（character_id 合法性 /
#       target keys 集合，纯集合运算）；L3 语义 checker / T2
#       source_patch / triage 不开（source_context=None）；无 regen。
# false：跳过 per-lane repair，仅靠终点 validate_baseline gate
#        （strict → ±10% length tolerance）兜底——旧行为等价。
repair_enabled            = true


# ----------------------------------------------------------------
# [phase3] Phase 3 阶段提取
# ----------------------------------------------------------------
[phase3]
# 单次提取 LLM 调用硬超时（秒）。world / char_snapshot / char_support
# 三种 lane 共用此值。订阅模式下推理耗时不固定，1h 给充足余量。
extraction_timeout_s = 3600

# 单次审校 / repair 内 LLM 调用硬超时（秒）。比提取短，因为审校 prompt
# 输入更小、输出更确定。
review_timeout_s     = 600

# claude -p --max-turns 上限：单次会话内最多允许的 agentic 轮数。
# 调高可让 agent 探索更多文件 / 完成更多 schema 修订循环；调低可强制
# agent 早返回。Phase 0 chunk 20 章 / chunk-level 5 字段聚合 + Phase 3
# stage_snapshot schema 修订循环单 chunk 实测有时撞 50 上限触发
# `error_max_turns`，故全局放到 80。
max_turns            = 80

# 单 char_snapshot lane 内部是否再拆 4 个并行 sub-lane（决策 #55）。
# true：sub-lane 模式——char_expression / char_decision / char_internal /
#       char_social 四 sub-lane 并行跑同一份 prompt 模板（占位
#       `{lane_scope}` 切换字段子集），落 `.partial/{stage_id}_{lane}.json`，
#       由 `extraction/persona_extraction/phases/snapshot_merge.py` 合并；merge
#       前置 hard gate 校验字段集合互斥 + 全覆盖 + 三方 keys ==
#       target_baseline。Wall-time bottleneck 进一步降低——原 3 sub-lane
#       时代 cognition 是单点瓶颈，本次切成 internal + social 分担。
# false：单 lane 等价 `lane_scope = ALL`，phase 3 现状不变。light_novel
#        模式单 stage 字符数小，4 sub-lane 启动开销可能 > 抽取耗时收益，
#        建议手切到 false。
# CLI 覆盖：`--char-snapshot-sub-lanes` / `--no-char-snapshot-sub-lanes`。
# 字段归属表见 docs/architecture/extraction_workflow.md §6.2。
char_snapshot_sub_lanes = true


# ----------------------------------------------------------------
# [phase4] Phase 4 场景切分
# ----------------------------------------------------------------
[phase4]
# 章节级并行度（ThreadPoolExecutor）。Phase 4 是 work-level 全局任务，
# 并行越高越快但也越容易撞限额。默认 **12**，与 [phase0].concurrency 对齐
# （决策 #55 4-sub-lane 拓扑覆盖）。
concurrency = 12

# 单章节单次运行内的 retry 次数上限。FAILED 章节（validate 失败 / 解析失败 /
# LLM 错误）会被回插队列并在 prompt 里注入 prior_error 重新切，最多再试这么
# 多次。总尝试数 = 1 + max_retries_per_chapter。超出仍失败 → ERROR，由
# `--resume` 下次运行恢复 PENDING 重新计数。
max_retries_per_chapter = 2

# 短路熔断（防止短时密集失败榨干配额）：
#   若 circuit_breaker_window_s 秒内累计失败次数 ≥ threshold，
#   暂停 circuit_breaker_pause_s 秒后再继续。
# 本机制与 §11.13 的 token-limit 暂停**正交**：前者防短时密集失败，
# 后者防限额超出。
circuit_breaker_failure_threshold = 8
circuit_breaker_window_s          = 60
circuit_breaker_pause_s           = 180


# ----------------------------------------------------------------
# [repair] Phase 3 修复框架（checker × fixer 矩阵）
# ----------------------------------------------------------------
[repair]
# 各 tier 的单轮重试次数上限（Phase B 修复循环内）。每个 tier 另由
# coordinator 硬封顶 2 次（T-REPAIR-NO-REEXTRACT）。已无 T3 全文重跑。
t0_retry = 1     # T0 程序化修复（0 token）
t1_retry = 3     # T1 局部 patch（快、便宜、不载 source）
t2_retry = 3     # T2 source_patch（带原文上下文）

# Phase B 修复循环最大轮数。一轮 = 一次完整 fix + scoped recheck。
total_round_limit = 5

# 是否启用源文本差异 triage（详见 §11.4.7）。关闭后将不允许把 L3
# 残留接受为"作者本身的 bug"，所有 L3 issue 必须由 fixer 解决。
triage_enabled = true

# 单文件 triage 接受 SourceNote 的最大数。L3 source_inherent（LLM
# 判定）与 L2 coverage_shortage（min_examples 不足、程序 0 token）
# 共用同一上限。防止 LLM 把整个文件的残留全归因为"源文本问题"，同时
# 限制 coverage_shortage 滥用。
triage_accept_cap_per_file = 5

# 单 stage 内每文件独立 repair 的并发 worker 数。每个 worker 跑一次
# `coordinator.run(files=[single])`（Phase A + Phase B + L3 gate +
# Phase C 全流程）。Anthropic Opus 订阅下 ~8-10 并发能撑住；频繁看到
# `rate_limit_pause.json` 时降到 4-5。1 = 单线程（旧行为）。
repair_concurrency = 10

# 未决语义（L3）问题「记录+继续」开关。开启后，若某 stage 的 repair 收尾
# 时残留的 error 只剩 category=="semantic"（跨字段一致性等 L3 问题，
# field-level 自动修复常追不平），则不判 ERROR 停机——把未决 issue 写进
# `works/{work_id}/analysis/deferred_repairs/{stage_id}.jsonl`（随 stage
# commit 一起提交），stage 照常提交继续跑；跑完全部 stage 后由 Phase 3.5
# 收尾修复 pass 读台账逐条精准修，不重跑整个 stage。任何残留的
# json_syntax / schema / structural / cross_file error（或 repair worker
# 崩溃）仍然硬 ERROR——那些会让下游 stage 读不了。代码默认 false（保留
# 停机语义）；本项目开启。
defer_unresolved_semantic = true


# ----------------------------------------------------------------
# [backoff] 退避策略（非 token-limit）
# ----------------------------------------------------------------
[backoff]
# 快速空失败检测：duration < threshold 且 stderr 空 → 视为 CLI 启动期
# 瞬态错误，按 backoff 序列重试。
fast_empty_failure_threshold_s = 5
fast_empty_failure_backoff_s   = [30, 60, 120]


# ----------------------------------------------------------------
# [rate_limit] Token 限额暂停与恢复（§11.13）
# ----------------------------------------------------------------
[rate_limit]
# reset 时刻后再等多少秒才恢复（避免与服务端时钟微小漂移抢跑）。
resume_buffer_s = 60

# 当 stderr 中无法解析 reset 时刻时的处理策略：
#   "probe"  — sleep parse_fallback_sleep_s → 发一次最小 claude -p
#              探测 → 仍限则循环
#   "fixed"  — 一次性 sleep parse_fallback_sleep_s 然后继续
parse_fallback_strategy = "probe"
parse_fallback_sleep_s  = 1800     # 30 分钟

# 周限额触达时的最大等待小时数。
#   weekly_over_limit_action = "stop"：等待时长 ≥ 本阈值 → exit 2
#   weekly_over_limit_action = "wait"：忽略阈值，无限等待
weekly_max_wait_h        = 12
weekly_over_limit_action = "stop"

# Probe 硬停时长（§11.13.8）：单次 probe 会话累计等待 ≥ 本阈值 →
# 写 rate_limit_exit.log + exit 2。用于防御 Anthropic 长时间不可用或
# stderr 格式永远无法解析的情况，避免 cron/background 无限挂起。
# 单位：小时。Anchored on pause 记录里的 probe_session_started_at。
probe_max_wait_h = 6

# Probe leader 选举（§11.13.6）：unknown 暂停下只有 leader lane 发起
# claude -p probe 调用；其他 lane 静默等待 leader 更新 pause 记录。
# claim 超过本 TTL 未刷新 → 视为 leader 已挂，其他 lane 可重新接手。
probe_claim_ttl_s = 120

# Follower 轮询间隔：非 leader lane 醒来后 re-read pause 记录前 sleep
# 的秒数。取值应 ≤ probe_claim_ttl_s。
probe_follower_poll_s = 30


# ----------------------------------------------------------------
# [runtime] 运行时
# ----------------------------------------------------------------
[runtime]
# --max-runtime 默认值（分钟）。0 = 无限制。
# 注意：rate-limit 暂停期不计入此时长（§11.13.7）。
max_runtime_min_default = 360

# 后台模式心跳间隔（秒）。每个 lane 的子进程也按此间隔打印
# "... running"。
heartbeat_interval_s = 30

# 默认 LLM backend："claude" 或 "codex"。CLI `--backend` 覆盖。
default_backend = "claude"


# ----------------------------------------------------------------
# [logging] 日志保留
# ----------------------------------------------------------------
[logging]
# Phase 3 lane 失败诊断日志（works/{work_id}/analysis/progress/
# failed_lanes/）的保留天数；超过则在下次启动时自动清理。0 = 永不
# 清理。
failed_lanes_retention_days = 30

# extraction.log 的滚动份数。每次启动 orchestrator 时，现有 log 会滚动
# 到 .1 / .2 / ...，超过此上限的最旧一份被删除。0 = 不滚动（持续 append）。
extraction_log_backup_count = 3


# ----------------------------------------------------------------
# [git] Git 集成
# ----------------------------------------------------------------
[git]
# extraction 分支名前缀。最终分支名为 `{prefix}{work_id}`。
extraction_branch_prefix = "extraction/"

# 全部 stage COMMITTED 后 squash-merge 的目标分支。三分支模型：main 只
# 承载框架（对外 push），extraction/{work_id} 是逐部作品的本地工作分支，
# library 是完成态归档分支（永不 push）。默认值 `library` 让作品产物
# 永久不回流 main、保持远程仓库洁净。
squash_merge_target = "library"

# 全部 stage COMMITTED 后是否自动执行 squash-merge。false 时仅打印
# 交互式提示，由用户确认。
auto_squash_merge = false
