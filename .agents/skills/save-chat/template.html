<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --ink: #1f2329; --muted: #6b7280;
    --line: #e5e7eb; --user-accent: #2563eb; --user-bg: #eef3fe;
    --ai-accent: #0d9488; --ai-bg: #f0fbf9; --code-bg: #f1f3f5;
    --sum-bg: #fffaf0; --sum-accent: #b45309; --sum-line: #f0e0c0;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.7; font-size: 15.5px; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 20px 80px; }

  header.doc { background: linear-gradient(135deg, #1e293b 0%, #0f766e 100%); color: #fff; padding: 34px 20px 30px; margin-bottom: 28px; }
  header.doc .inner { max-width: 860px; margin: 0 auto; }
  header.doc .kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; margin: 0 0 8px; }
  header.doc h1 { margin: 0 0 16px; font-size: 27px; font-weight: 700; line-height: 1.25; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 10px; }
  .meta .tag { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; }
  .meta .tag b { font-weight: 600; opacity: .85; margin-right: 4px; }

  /* summary block */
  .summary { background: var(--sum-bg); border: 1px solid var(--sum-line); border-left: 4px solid var(--sum-accent); border-radius: 10px; padding: 6px 24px 18px; margin-bottom: 30px; }
  .summary h2 { font-size: 19px; margin: 18px 0 10px; color: #7c3a00; border-bottom: 1px solid var(--sum-line); padding-bottom: 6px; }
  .summary h3 { font-size: 15.5px; margin: 16px 0 6px; color: #7c3a00; }
  .summary > :first-child { margin-top: 14px; }

  /* messages */
  .msg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 22px 14px; margin: 0 0 18px; }
  .msg.user { border-left: 4px solid var(--user-accent); background: var(--user-bg); }
  .msg.ai   { border-left: 4px solid var(--ai-accent); }
  .role { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
  .msg.user .role { color: var(--user-accent); }
  .msg.ai .role { color: var(--ai-accent); }
  .role .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .role .idx { margin-left: auto; font-weight: 500; font-size: 11.5px; opacity: .6; text-transform: none; }

  .content > :first-child { margin-top: 6px; }
  .content p { margin: 10px 0; }
  .content h3 { font-size: 17px; margin: 18px 0 8px; }
  .content h4 { font-size: 15px; margin: 16px 0 6px; }
  .content h5, .content h6 { font-size: 14px; margin: 14px 0 6px; color: var(--muted); }
  .content ul, .content ol { margin: 10px 0; padding-left: 24px; }
  .content li { margin: 4px 0; }
  .content code { background: var(--code-bg); border-radius: 4px; padding: 1px 5px; font-family: var(--mono); font-size: 13px; }
  .content pre { background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-size: 13px; line-height: 1.55; }
  .content pre code { background: none; padding: 0; color: inherit; font-size: 13px; }
  .content blockquote { margin: 10px 0; padding: 2px 16px; border-left: 3px solid var(--line); color: var(--muted); }
  .content a { color: var(--user-accent); text-decoration: none; border-bottom: 1px solid rgba(37,99,235,.3); }
  .content a:hover { border-bottom-color: var(--user-accent); }
  .content hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
  .content table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
  .content th, .content td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .content th { background: var(--code-bg); font-weight: 600; }

  footer { max-width: 860px; margin: 30px auto 0; padding: 0 20px; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<header class="doc">
  <div class="inner">
    <p class="kicker">{{KICKER}}</p>
    <h1>{{TITLE}}</h1>
    <div class="meta">{{META_TAGS}}</div>
  </div>
</header>

<main class="wrap">
{{SUMMARY}}
{{TRANSCRIPT}}
</main>

<footer>Generated by <code>/save-chat</code> · {{GENERATED}}</footer>
</body>
</html>
